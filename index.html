<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TOZ BGM Scanner</title>

<style>
body{
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:30px;
}

button{
  padding:14px 22px;
  font-size:18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  margin:8px;
}

#status{
  margin-top:20px;
  white-space:pre-line;
  color:#cbd5e1;
}

#result{
  margin-top:25px;
  font-size:34px;
  font-weight:bold;
  color:#7dd3fc;
}
</style>
</head>

<body>

<h1>TOZ BGM Scanner</h1>

<button onclick="buildLibrary()">Build BGM Library</button>
<button onclick="startListening()">🎤 Start Listening</button>

<div id="status">Waiting...</div>
<div id="result">Ready</div>

<script>

const LISTEN_DURATION = 1500;

const bgmFiles = [
  "Temple of Time.mp3",
  "Sleepywood.mp3",
  "Shanghai.mp3",
  "Showa.mp3",
  "Rien.mp3",
  "Perion.mp3",
  "Orbis.mp3",
  "Omega Sector.mp3",
  "New Leaf City.mp3",
  "Nautilus.mp3",
  "Mushroom Shrine.mp3",
  "Mu Lung.mp3",
  "Magatia.mp3",
  "Ludibrium.mp3",
  "Lith Harbor.mp3",
  "Leafre.mp3",
  "Korean Folk Town.mp3",
  "Kerning City.mp3",
  "Kampung Village.mp3",
  "Herb Town.mp3",
  "Henesys.mp3",
  "Golden Temple.mp3",
  "Florina Beach.mp3",
  "Ereve.mp3",
  "Ellinia.mp3",
  "Ellin Forest.mp3",
  "El Nath.mp3",
  "CBD.mp3",
  "Boat Quay Town.mp3",
  "Ariant.mp3",
  "Aquarium.mp3",
  "Amoria.mp3"
];

let audioCtx;
let library = [];

function setStatus(text){
  document.getElementById("status").innerText = text;
}

function setResult(text){
  document.getElementById("result").innerText = text;
}

async function getAudioContext(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

async function loadAudioFile(file){
  const ctx = await getAudioContext();

  const res = await fetch("bgm/" + encodeURIComponent(file));

  if(!res.ok){
    throw new Error("Cannot load " + file);
  }

  const arr = await res.arrayBuffer();

  return await ctx.decodeAudioData(arr);
}

function fingerprint(buffer){

  const data = buffer.getChannelData(0);

  const bucket = 2048;

  const out = [];

  for(let i = 0; i < data.length; i += bucket){

    let sum = 0;

    for(let j = i; j < i + bucket && j < data.length; j++){
      sum += Math.abs(data[j]);
    }

    out.push(sum / bucket);
  }

  return normalize(out);
}

function normalize(arr){

  const mean = arr.reduce((a,b)=>a+b,0) / arr.length;

  const centered = arr.map(x => x - mean);

  const max = Math.max(...centered.map(x => Math.abs(x))) || 1;

  return centered.map(x => x / max);
}

function similarity(a,b){

  const len = Math.min(a.length,b.length);

  let dot = 0;
  let aa = 0;
  let bb = 0;

  for(let i=0;i<len;i++){
    dot += a[i] * b[i];
    aa += a[i] * a[i];
    bb += b[i] * b[i];
  }

  return dot / (Math.sqrt(aa) * Math.sqrt(bb) || 1);
}

function bestSlidingScore(sample, full){

  const sampleLen = sample.length;

  let best = -999;

  for(let start = 0; start < full.length - sampleLen; start += 5){

    const slice = full.slice(start, start + sampleLen);

    const score = similarity(sample, slice);

    if(score > best){
      best = score;
    }
  }

  return best;
}

async function buildLibrary(){

  library = [];

  setStatus("Loading BGM Library...");
  setResult("Building...");

  for(let i=0;i<bgmFiles.length;i++){

    const file = bgmFiles[i];

    setStatus(`Loading ${i+1}/${bgmFiles.length}\n${file}`);

    try{

      const buffer = await loadAudioFile(file);

      const print = fingerprint(buffer);

      library.push({
        name:file.replace(".mp3",""),
        print
      });

    }catch(e){

      console.error(e);

      setStatus("Failed loading:\n" + file);

      return;
    }
  }

  setStatus("Library Ready");
  setResult("Ready");
}

async function startListening(){

  if(library.length === 0){
    setStatus("Please Build Library First");
    return;
  }

  setStatus("Listening 1.5 seconds...");
  setResult("Scanning...");

  try{

    const stream = await navigator.mediaDevices.getUserMedia({
      audio:true
    });

    const recorder = new MediaRecorder(stream);

    const chunks = [];

    recorder.ondataavailable = e => chunks.push(e.data);

    recorder.start();

    setTimeout(() => recorder.stop(), LISTEN_DURATION);

    recorder.onstop = async () => {

      stream.getTracks().forEach(track => track.stop());

      const blob = new Blob(chunks,{type:"audio/webm"});

      const arr = await blob.arrayBuffer();

      const ctx = await getAudioContext();

      const buffer = await ctx.decodeAudioData(arr);

      const sample = fingerprint(buffer);

      let results = library.map(song => ({
        name:song.name,
        score:bestSlidingScore(sample, song.print)
      }));

      results.sort((a,b)=>b.score-a.score);

      const best = results[0];

      const confidence = Math.round(Math.max(0,best.score) * 100);

      setResult(best.name);

      setStatus(
        `Detected: ${best.name}\nConfidence: ${confidence}%`
      );
    };

  }catch(e){

    console.error(e);

    setStatus("Microphone blocked or denied.");
  }
}

</script>
</body>
</html>
