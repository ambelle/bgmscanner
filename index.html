<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Belle & Gil TOZ BGM Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071018;
  --glass:rgba(255,255,255,.085);
  --glass2:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.14);
  --text:#f8fafc;
  --muted:#b8c4d6;
  --accent:#8bdcff;
  --accent2:#c4b5fd;
  --good:#86efac;
  --warn:#fde68a;
  --bad:#fca5a5;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Manrope",system-ui,sans-serif;color:var(--text)}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% -18%, rgba(125,211,252,.24), transparent 34%),
    radial-gradient(circle at 18% 18%, rgba(196,181,253,.18), transparent 30%),
    radial-gradient(circle at 86% 70%, rgba(134,239,172,.10), transparent 28%),
    linear-gradient(180deg,#071018,#0b1220 55%,#05070d);
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:-20%;
  background:
    radial-gradient(circle, rgba(255,255,255,.14) 0 1px, transparent 1.5px) 0 0/46px 46px,
    radial-gradient(circle, rgba(125,211,252,.11) 0 1px, transparent 1.5px) 18px 25px/72px 72px;
  opacity:.42;
  animation:stars 18s linear infinite;
  pointer-events:none;
}
body::after{
  content:"";
  position:fixed;
  width:480px;
  height:480px;
  border-radius:999px;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(139,220,255,.13), rgba(196,181,253,.07) 42%, transparent 70%);
  filter:blur(18px);
  animation:pulseGlow 4.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes stars{
  from{transform:translate3d(0,0,0)}
  to{transform:translate3d(-46px,46px,0)}
}
@keyframes pulseGlow{
  0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.96)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
}
.app{
  width:min(94vw,560px);
  border:1px solid var(--border);
  background:linear-gradient(180deg,var(--glass),rgba(255,255,255,.045));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:32px;
  padding:26px;
  box-shadow:
    0 26px 90px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.10);
  overflow:hidden;
}
.app::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(120deg, transparent 0%, rgba(255,255,255,.08) 22%, transparent 42%),
    radial-gradient(circle at 50% 0%, rgba(139,220,255,.18), transparent 42%);
  opacity:.75;
  pointer-events:none;
}
.app > *{position:relative;z-index:1}
.header{text-align:center}
h1{
  margin:0;
  font-size:31px;
  line-height:1.08;
  font-weight:800;
  letter-spacing:-.7px;
  background:linear-gradient(135deg,#f8fafc,#bfeeff 45%,#d9ceff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 26px rgba(139,220,255,.12);
}
.sub{margin:10px auto 0;max-width:430px;color:var(--muted);font-size:14px;line-height:1.55}
.hidden-sub{display:none}
.badge{
  margin:20px auto 0;
  width:max-content;
  max-width:100%;
  padding:8px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.075);
  color:#dbeafe;
  border:1px solid rgba(255,255,255,.09);
  font-size:13px;
}
.result{
  margin-top:28px;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:34px;
  font-weight:800;
  letter-spacing:-.7px;
  color:var(--accent);
  word-break:break-word;
  text-shadow:0 0 22px rgba(139,220,255,.24);
  animation:resultFloat 3.2s ease-in-out infinite;
}
@keyframes resultFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}
.conf{
  margin-top:10px;
  height:10px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
}
.conf > div{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:999px;
  transition:width .25s ease;
}
.status{
  margin-top:16px;
  min-height:82px;
  padding:14px 15px;
  border-radius:18px;
  background:var(--glass2);
  border:1px solid rgba(255,255,255,.08);
  color:var(--muted);
  white-space:pre-line;
  font-size:14px;
  line-height:1.55;
}
button{
  width:100%;
  margin-top:18px;
  border:0;
  border-radius:20px;
  padding:17px 18px;
  font-size:18px;
  font-weight:800;
  color:#06101b;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 14px 34px rgba(125,211,252,.16), inset 0 1px 0 rgba(255,255,255,.42);
  cursor:pointer;
  transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
}
button:not(:disabled):active{transform:scale(.985)}
button:not(:disabled):hover{
  filter:brightness(1.04);
  box-shadow:0 18px 42px rgba(125,211,252,.22), inset 0 1px 0 rgba(255,255,255,.48);
}
button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.secondary{
  margin-top:10px;
  background:rgba(255,255,255,.10);
  color:#e5eefb;
  border:1px solid rgba(255,255,255,.12);
}
.smallrow{margin-top:14px;display:flex;gap:10px}
.smallrow button{font-size:13px;padding:12px;margin-top:0;border-radius:15px}
.matches{margin-top:16px;display:grid;gap:9px}
.match{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px;
  border-radius:15px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.06);
  color:#dce7f5;
  font-size:13px;
}
.match span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.footer{margin-top:16px;text-align:center;color:#8fa1b8;font-size:12px;line-height:1.45}
</style>
</head>

<body>
<main class="app">
  <section class="header">
    <h1>Belle & Gil TOZ BGM Scanner</h1>
    <div class="sub hidden-sub"></div>
    <div class="badge" id="readyState">Checking saved scanner...</div>
  </section>

  <div class="result" id="result">Preparing...</div>
  <div class="conf"><div id="confBar"></div></div>
  <div class="status" id="status">Opening saved BGM library...</div>

  <button id="scanBtn" disabled>Start Scan</button>

  <div class="smallrow">
    <button class="secondary" id="prepareBtn">Prepare / Resume</button>
    <button class="secondary" id="clearBtn">Clear Cache</button>
  </div>

  <div class="matches" id="matches"></div>

  <div class="footer">
    First-time setup may take a few taps on iPhone. After all 32 are saved, it opens ready immediately.
  </div>
</main>

<script>
/*
  TOZ BGM Scanner v7 Safari Resume-Safe

  Fix for iPhone Safari auto-refresh:
  - Does NOT hold all 32 decoded MP3 buffers in memory.
  - Saves each completed BGM immediately into IndexedDB.
  - If Safari reloads halfway, tap Prepare / Resume and it continues from the next missing BGM.
  - Each song is stored separately instead of one huge cache object.
*/

const SCAN_SECONDS = 1.5;
const VERIFY_SECONDS = 1.0;
const FFT_SIZE = 2048;
const HOP_SIZE = 1024;
const SAMPLE_RATE_TARGET = 11025;
const MAX_LIBRARY_SECONDS = 80;
const CACHE_VERSION = 7;
const DB_NAME = "toz_bgm_scanner_v7";
const STORE_NAME = "songs";
const META_KEY = "__meta__";

const bgmFiles = [
  "Temple of Time.mp3",
  "Sleepywood.mp3",
  "Shanghai.mp3",
  "Showa.mp3",
  "Rien.mp3",
  "Perion.mp3",
  "Orbis.mp3",
  "Omega Sector.mp3",
  "New Leaf City.mp3",
  "Nautilus.mp3",
  "Mushroom Shrine.mp3",
  "Mu Lung.mp3",
  "Magatia.mp3",
  "Ludibrium.mp3",
  "Lith Harbor.mp3",
  "Leafre.mp3",
  "Korean Folk Town.mp3",
  "Kerning City.mp3",
  "Kampung Village.mp3",
  "Herb Town.mp3",
  "Henesys.mp3",
  "Golden Temple.mp3",
  "Florina Beach.mp3",
  "Ereve.mp3",
  "Ellinia.mp3",
  "Ellin Forest.mp3",
  "El Nath.mp3",
  "CBD.mp3",
  "Boat Quay Town.mp3",
  "Ariant.mp3",
  "Aquarium.mp3",
  "Amoria.mp3"
];

let audioCtx = null;
let library = [];
let libraryReady = false;
let preparing = false;

const $ = id => document.getElementById(id);
const scanBtn = $("scanBtn");
const prepareBtn = $("prepareBtn");
const clearBtn = $("clearBtn");

function setResult(t){ $("result").innerText = t; }
function setStatus(t){ $("status").innerText = t; }
function setReady(t){ $("readyState").innerText = t; }
function setConfidence(v){ $("confBar").style.width = Math.max(0, Math.min(100, v)) + "%"; }

function stripName(file){ return file.replace(/\.[^/.]+$/, ""); }

function renderMatches(list){
  $("matches").innerHTML = list.slice(0,5).map((r,i)=>`
    <div class="match">
      <span>#${i+1} ${r.name}</span>
      <span>${Math.round(r.best || r.total || 0)}</span>
    </div>
  `).join("");
}

async function getAudioContext(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended"){
    await audioCtx.resume();
  }
  return audioCtx;
}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME,1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(STORE_NAME)){
        db.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error || new Error("IndexedDB failed"));
  });
}

async function idbGet(key){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,"readonly");
    const st = tx.objectStore(STORE_NAME);
    const req = st.get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}

async function idbSet(key,value){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,"readwrite");
    tx.objectStore(STORE_NAME).put(value,key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

async function idbClear(){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,"readwrite");
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(label + " timed out")), ms))
  ]);
}

async function loadAudioFile(file){
  const ctx = await getAudioContext();
  const url = "bgm/" + encodeURIComponent(file);
  const res = await withTimeout(fetch(url, { cache:"force-cache" }), 12000, "Fetch " + file);
  if(!res.ok) throw new Error("Cannot load " + file + " (" + res.status + ")");
  const arr = await res.arrayBuffer();
  const buffer = await withTimeout(ctx.decodeAudioData(arr), 16000, "Decode " + file);
  return buffer;
}

function getMono(buffer, maxSeconds=null){
  const sr = buffer.sampleRate;
  const len = maxSeconds ? Math.min(buffer.length, Math.floor(maxSeconds * sr)) : buffer.length;
  const ch0 = buffer.getChannelData(0);
  const out = new Float32Array(len);

  if(buffer.numberOfChannels === 1){
    for(let i=0;i<len;i++) out[i]=ch0[i];
  }else{
    const ch1 = buffer.getChannelData(1);
    for(let i=0;i<len;i++) out[i]=(ch0[i]+ch1[i])*0.5;
  }

  return { data:out, sampleRate:sr };
}

function resampleToTarget(input, fromRate, targetRate){
  if(fromRate === targetRate) return input;
  const ratio = fromRate / targetRate;
  const newLen = Math.floor(input.length / ratio);
  const out = new Float32Array(newLen);

  for(let i=0;i<newLen;i++){
    const pos = i * ratio;
    const i0 = Math.floor(pos);
    const i1 = Math.min(i0+1, input.length-1);
    const frac = pos - i0;
    out[i] = input[i0]*(1-frac) + input[i1]*frac;
  }

  return out;
}

function hanning(n){
  const w = new Float32Array(n);
  for(let i=0;i<n;i++) w[i] = 0.5 * (1 - Math.cos((2*Math.PI*i)/(n-1)));
  return w;
}

const WINDOW = hanning(FFT_SIZE);

function fftRadix2(re, im){
  const n = re.length;
  let j = 0;

  for(let i=1;i<n;i++){
    let bit = n >> 1;
    while(j & bit){ j ^= bit; bit >>= 1; }
    j ^= bit;
    if(i < j){
      [re[i], re[j]] = [re[j], re[i]];
      [im[i], im[j]] = [im[j], im[i]];
    }
  }

  for(let len=2; len<=n; len<<=1){
    const ang = -2 * Math.PI / len;
    const wlenR = Math.cos(ang), wlenI = Math.sin(ang);

    for(let i=0;i<n;i+=len){
      let wr=1, wi=0;

      for(let k=0;k<len/2;k++){
        const uR = re[i+k], uI = im[i+k];
        const vR = re[i+k+len/2]*wr - im[i+k+len/2]*wi;
        const vI = re[i+k+len/2]*wi + im[i+k+len/2]*wr;

        re[i+k] = uR + vR;
        im[i+k] = uI + vI;
        re[i+k+len/2] = uR - vR;
        im[i+k+len/2] = uI - vI;

        const nextWr = wr*wlenR - wi*wlenI;
        wi = wr*wlenI + wi*wlenR;
        wr = nextWr;
      }
    }
  }
}

function spectrum(frame){
  const re = new Float32Array(FFT_SIZE);
  const im = new Float32Array(FFT_SIZE);

  for(let i=0;i<FFT_SIZE;i++){
    re[i] = (frame[i] || 0) * WINDOW[i];
  }

  fftRadix2(re, im);

  const mags = new Float32Array(FFT_SIZE/2);

  for(let i=0;i<mags.length;i++){
    mags[i] = Math.sqrt(re[i]*re[i] + im[i]*im[i]);
  }

  return mags;
}

const BANDS = [
  [10,18], [19,29], [30,43], [44,62], [63,88],
  [89,124], [125,174], [175,244], [245,342], [343,480],
  [481,620], [621,760]
];

function peaksForFrame(mags){
  const peaks = [];
  let globalSum = 0;

  for(let i=0;i<mags.length;i++) globalSum += mags[i];

  const globalAvg = globalSum / Math.max(1,mags.length);

  for(let b=0;b<BANDS.length;b++){
    const [start,end] = BANDS[b];
    let bestBin = start;
    let bestMag = 0;
    let sum = 0;
    let count = 0;

    for(let i=start;i<=end && i<mags.length;i++){
      const v = mags[i];
      sum += v;
      count++;
      if(v > bestMag){
        bestMag = v;
        bestBin = i;
      }
    }

    const bandAvg = sum / Math.max(1,count);
    const strength = bestMag / Math.max(1e-9, bandAvg + globalAvg * 0.25);

    peaks.push({bin:bestBin,strength});
  }

  return peaks;
}

function makeFingerprints(floatData){
  let max = 0;

  for(let i=0;i<floatData.length;i++){
    max = Math.max(max, Math.abs(floatData[i]));
  }

  if(max > 0){
    for(let i=0;i<floatData.length;i++){
      floatData[i] = floatData[i] / max;
    }
  }

  const frameCount = Math.max(0, Math.floor((floatData.length - FFT_SIZE) / HOP_SIZE));
  const framePeaks = [];

  for(let f=0; f<frameCount; f++){
    const start = f * HOP_SIZE;
    const frame = floatData.subarray(start, start + FFT_SIZE);
    framePeaks.push(peaksForFrame(spectrum(frame)));
  }

  const hashes = [];
  const fanout = 4;

  for(let t=0; t<framePeaks.length - fanout; t++){
    const anchor = framePeaks[t];

    const ranked = anchor
      .map((p,band)=>({band,bin:p.bin,strength:p.strength}))
      .filter(p=>p.band>=1 && p.band<=11 && p.strength>=1.12)
      .sort((a,b)=>b.strength-a.strength)
      .slice(0,5);

    for(const a of ranked){
      const f1 = Math.round(a.bin / 2);

      for(let dt=1;dt<=fanout;dt++){
        const target = framePeaks[t+dt];
        if(!target) continue;

        const candidateBands = [
          a.band,
          Math.min(target.length-1,a.band+1),
          Math.max(0,a.band-1)
        ];

        for(const b2 of candidateBands){
          const tp = target[b2];

          if(!tp || tp.strength < 1.08) continue;

          const f2 = Math.round(tp.bin / 2);
          const strengthBucket = Math.min(5, Math.floor((a.strength + tp.strength) / 1.2));

          hashes.push([`${f1}|${f2}|${dt}|${a.band}|${b2}`, t, strengthBucket]);
          hashes.push([`${Math.round(f1/2)}~${Math.round(f2/2)}~${dt}~${a.band}`, t, Math.max(1,strengthBucket-1)]);
        }
      }
    }
  }

  return hashes;
}

function buildIndexFromHashes(hashes){
  const index = {};

  for(const item of hashes){
    const hash = item[0];
    const t = item[1];
    const weight = item[2] || 1;

    if(!index[hash]) index[hash] = [];

    if(index[hash].length < 90){
      index[hash].push([t,weight]);
    }
  }

  return index;
}

function scoreSampleAgainstSong(sampleHashes, songIndex){
  const offsets = new Map();
  let matched = 0;

  for(const item of sampleHashes){
    const hash = item[0];
    const sampleT = item[1];
    const sampleWeight = item[2] || 1;
    const times = songIndex[hash];

    if(!times) continue;

    matched++;

    for(const entry of times){
      const songT = entry[0];
      const songWeight = entry[1] || 1;
      const offset = songT - sampleT;
      offsets.set(offset, (offsets.get(offset)||0) + sampleWeight + songWeight);
    }
  }

  let best = 0;

  for(const [offset, score] of offsets.entries()){
    const cluster =
      score +
      (offsets.get(offset-1)||0)*0.65 +
      (offsets.get(offset+1)||0)*0.65 +
      (offsets.get(offset-2)||0)*0.35 +
      (offsets.get(offset+2)||0)*0.35;

    if(cluster > best) best = cluster;
  }

  return {
    best,
    matched,
    confidence: sampleHashes.length ? best / Math.max(18, sampleHashes.length * 0.22) : 0
  };
}

async function loadSavedSongsIntoMemory(){
  const meta = await idbGet(META_KEY);

  if(
    !meta ||
    meta.version !== CACHE_VERSION ||
    JSON.stringify(meta.files) !== JSON.stringify(bgmFiles)
  ){
    library = [];
    return 0;
  }

  const loaded = [];

  for(const file of bgmFiles){
    const song = await idbGet("song:" + file);
    if(song && song.version === CACHE_VERSION && song.name && song.index){
      loaded.push({ name:song.name, index:song.index });
    }
  }

  library = loaded;
  return loaded.length;
}

async function checkSavedLibrary(){
  try{
    const count = await loadSavedSongsIntoMemory();

    if(count === bgmFiles.length){
      libraryReady = true;
      scanBtn.disabled = false;
      setReady(`Ready • ${count}/${bgmFiles.length} saved`);
      setResult("Ready");
      setStatus("Scanner ready immediately from saved library.\nTap Start Scan.");
      setConfidence(100);
    }else if(count > 0){
      libraryReady = false;
      scanBtn.disabled = true;
      setReady(`Partial setup • ${count}/${bgmFiles.length} saved`);
      setResult("Resume");
      setStatus(
        `Saved progress found: ${count}/${bgmFiles.length} BGMs.\n` +
        "Tap Prepare / Resume to continue from the next missing BGM.\n\n" +
        "If Safari auto-refreshes, just tap Prepare / Resume again."
      );
      setConfidence(Math.round((count / bgmFiles.length) * 100));
    }else{
      libraryReady = false;
      scanBtn.disabled = true;
      setReady("First-time setup needed");
      setResult("Setup Needed");
      setStatus(
        "Tap Prepare / Resume once.\n" +
        "This version saves after every BGM, so Safari refresh will not lose progress."
      );
      setConfidence(0);
    }
  }catch(e){
    console.error(e);
    libraryReady = false;
    scanBtn.disabled = true;
    setReady("Storage error");
    setResult("Error");
    setStatus("Could not read saved library:\n" + e.message);
    setConfidence(0);
  }
}

async function prepareLibrary(){
  if(preparing) return;

  preparing = true;
  prepareBtn.disabled = true;
  scanBtn.disabled = true;
  $("matches").innerHTML = "";

  try{
    await getAudioContext();

    let savedCount = await loadSavedSongsIntoMemory();

    setReady(`Preparing • ${savedCount}/${bgmFiles.length} saved`);
    setResult("Preparing...");
    setConfidence(Math.round((savedCount / bgmFiles.length) * 100));

    await idbSet(META_KEY, {
      version:CACHE_VERSION,
      files:bgmFiles,
      updatedAt:Date.now()
    });

    for(let i=0;i<bgmFiles.length;i++){
      const file = bgmFiles[i];

      const existing = await idbGet("song:" + file);
      if(existing && existing.version === CACHE_VERSION && existing.index){
        continue;
      }

      setStatus(
        `Preparing ${i+1}/${bgmFiles.length}\n${file}\n\n` +
        `Saved progress: ${savedCount}/${bgmFiles.length}\n` +
        "If Safari refreshes, reopen and tap Prepare / Resume."
      );

      const buffer = await loadAudioFile(file);
      const mono = getMono(buffer, MAX_LIBRARY_SECONDS);
      const data = resampleToTarget(mono.data, mono.sampleRate, SAMPLE_RATE_TARGET);
      const hashes = makeFingerprints(data);
      const index = buildIndexFromHashes(hashes);

      await idbSet("song:" + file, {
        version:CACHE_VERSION,
        file,
        name:stripName(file),
        index,
        savedAt:Date.now()
      });

      savedCount++;

      setReady(`Preparing • ${savedCount}/${bgmFiles.length} saved`);
      setConfidence(Math.round((savedCount / bgmFiles.length) * 100));

      // Release references before next song.
      await new Promise(r=>setTimeout(r,120));
    }

    await checkSavedLibrary();

  }catch(e){
    console.error(e);
    await checkSavedLibrary();

    setStatus(
      "Preparation paused / failed:\n" +
      e.message +
      "\n\nTap Prepare / Resume again. Already-saved BGMs will be skipped."
    );
  }finally{
    preparing = false;
    prepareBtn.disabled = false;
  }
}

function getRecorderMimeType(){
  const options = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac"];
  for(const type of options){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)){
      return type;
    }
  }
  return "";
}

async function recordOnce(label, seconds = SCAN_SECONDS){
  const stream = await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:false,
      noiseSuppression:false,
      autoGainControl:false
    }
  });

  const mimeType = getRecorderMimeType();
  const recorder = mimeType ? new MediaRecorder(stream,{mimeType}) : new MediaRecorder(stream);
  const chunks = [];

  return new Promise((resolve,reject)=>{
    recorder.ondataavailable = e=>{
      if(e.data && e.data.size > 0) chunks.push(e.data);
    };

    recorder.onerror = e=>{
      stream.getTracks().forEach(t=>t.stop());
      reject(e.error || new Error("Recording failed"));
    };

    recorder.onstop = async ()=>{
      try{
        stream.getTracks().forEach(t=>t.stop());

        const blob = new Blob(chunks, { type:recorder.mimeType || mimeType || "audio/webm" });
        const arr = await blob.arrayBuffer();
        const ctx = await getAudioContext();
        const buffer = await ctx.decodeAudioData(arr);

        const mono = getMono(buffer, seconds);
        const data = resampleToTarget(mono.data, mono.sampleRate, SAMPLE_RATE_TARGET);
        const sampleHashes = makeFingerprints(data);

        const scored = library.map(song=>{
          const s = scoreSampleAgainstSong(sampleHashes, song.index);
          return {
            name:song.name,
            best:s.best,
            matched:s.matched,
            confidence:s.confidence
          };
        }).sort((a,b)=>b.best-a.best || b.matched-a.matched);

        resolve(scored);
      }catch(e){
        reject(e);
      }
    };

    setStatus(label);
    recorder.start();

    setTimeout(()=>{
      if(recorder.state !== "inactive") recorder.stop();
    }, Math.round(seconds * 1000));
  });
}

function mergeScores(lists){
  const m = new Map();

  for(const list of lists){
    list.forEach((item,idx)=>{
      const rankBonus = Math.max(0, 20 - idx * 4);
      const add = item.best + rankBonus;
      m.set(item.name, (m.get(item.name)||0) + add);
    });
  }

  return [...m.entries()]
    .map(([name,total])=>({name,total,best:total}))
    .sort((a,b)=>b.total-a.total);
}

async function scan(){
  if(!libraryReady){
    setStatus("Library is not fully prepared yet.\nTap Prepare / Resume until it reaches 32/32.");
    return;
  }

  scanBtn.disabled = true;
  prepareBtn.disabled = true;
  $("matches").innerHTML = "";
  setConfidence(0);

  try{
    await getAudioContext();

    setReady("Listening...");
    setResult("Listening...");

    const pass1 = await recordOnce("Pass 1/2: listening for 1.5 seconds...", SCAN_SECONDS);
    setConfidence(45);

    const pass2 = await recordOnce("Pass 2/2: quick verification for 1 second...", VERIFY_SECONDS);
    setConfidence(75);

    let final = mergeScores([pass1, pass2]);

    const best = final[0];
    const second = final[1];
    const ratio = second && second.total > 0 ? best.total / second.total : 99;
    const gap = second ? best.total - second.total : best.total;

    let usedThird = false;

    if(ratio < 1.10 || gap < 10){
      usedThird = true;
      const pass3 = await recordOnce("Close result detected.\nPass 3/3: final 1-second confirmation...", VERIFY_SECONDS);
      final = mergeScores([pass1, pass2, pass3]);
    }

    const b = final[0];
    const s = final[1];
    const finalRatio = s && s.total > 0 ? b.total / s.total : 99;
    const finalGap = s ? b.total - s.total : b.total;
    const unsure = finalRatio < 1.08 || finalGap < 8;

    setResult(unsure ? `Unsure: ${b.name}` : b.name);
    setReady(unsure ? "Low confidence" : "Match found");
    setConfidence(unsure ? 68 : 100);
    renderMatches(final);

    setStatus(
      `${usedThird ? "Triple-pass" : "Dual-pass"} verification completed.\n` +
      `Best match: ${b.name}\n` +
      `Gap vs 2nd: ${Math.round(finalGap)}\n` +
      `Ratio vs 2nd: ${finalRatio === 99 ? "N/A" : finalRatio.toFixed(2) + "x"}\n` +
      (unsure ? "\nResult is close. Re-scan for safest answer." : "\nHigh-confidence result.")
    );

  }catch(e){
    console.error(e);
    setReady("Mic / scan error");
    setResult("Error");
    setConfidence(0);
    setStatus(
      "Scan failed:\n" +
      e.message +
      "\n\nAllow microphone permission and open the site using HTTPS."
    );
  }finally{
    scanBtn.disabled = false;
    prepareBtn.disabled = false;
  }
}

prepareBtn.addEventListener("click", prepareLibrary);
scanBtn.addEventListener("click", scan);

clearBtn.addEventListener("click", async ()=>{
  await idbClear();
  library = [];
  libraryReady = false;
  $("matches").innerHTML = "";
  await checkSavedLibrary();
});

window.addEventListener("load", checkSavedLibrary);
</script>
